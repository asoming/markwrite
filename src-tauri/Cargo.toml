[package]
name = "markwrite"
version = "1.2.1"
description = "A local-first Markdown editor"
authors = ["Markwrite"]
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
png = "0.18"
url = "2"
percent-encoding = "2"
sha2 = "0.10"
semver = "1"
encoding_rs = "0.8"
fs2 = "0.4"
zip = { version = "2", default-features = false }
notify = "8"
trash = "5"
open = "5"
tauri-plugin-single-instance = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
arboard = "3.6"
keyring = { version = "=3.6.3", features = ["windows-native", "apple-native"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[profile.dev]
debug = 0
incremental = true
