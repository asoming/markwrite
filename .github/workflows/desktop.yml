name: Desktop builds

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-22.04
            args: --bundles deb
            artifact: markwrite-linux-x86_64
            paths: |
              src-tauri/target/release/bundle/deb/*.deb
          - name: Windows x86_64
            os: windows-latest
            args: --config src-tauri/tauri.windows.conf.json --bundles nsis
            artifact: markwrite-windows-x86_64
            paths: |
              src-tauri/target/release/bundle/nsis/*-setup.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Test native services
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build installer
        run: npm run tauri -- build ${{ matrix.args }}
      - name: Ensure WebView2 runtime for Windows smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Microsoft documents these per-machine and per-user runtime keys:
          # https://learn.microsoft.com/microsoft-edge/webview2/concepts/distribution
          $runtimeKeys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          function Test-WebViewRuntime {
            foreach ($key in $runtimeKeys) {
              $version = (Get-ItemProperty -Path $key -Name pv -ErrorAction SilentlyContinue).pv
              if ($version -and $version -ne '0.0.0.0') { return $true }
            }
            return $false
          }
          if (-not (Test-WebViewRuntime)) {
            $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            $install = Start-Process -FilePath $installer -ArgumentList '/silent', '/install' -Wait -PassThru
            if (-not (Test-WebViewRuntime)) { throw "WebView2 runtime installation failed (exit $($install.ExitCode))" }
          }
      - name: Install Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'NSIS installer was not generated' }
          $installDir = Join-Path $env:RUNNER_TEMP 'Markwrite Install Smoke'
          $install = Start-Process -FilePath $setup.FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS installation failed: $($install.ExitCode)" }
          $installedExe = Join-Path $installDir 'markwrite.exe'
          if (-not (Test-Path $installedExe)) { throw 'Installed application is missing' }
          "MARKWRITE_SMOKE_EXE=$installedExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MARKWRITE_SMOKE_DIR=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify Windows file association quoting
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $classKey = 'HKCU:\Software\Classes\Markwrite.Markdown'
          $command = (Get-Item -LiteralPath "$classKey\shell\open\command").GetValue('')
          $expected = '"{0}" "%1"' -f $env:MARKWRITE_SMOKE_EXE
          if ($command -cne $expected) { throw "File association command must quote both executable and document: $command" }
          foreach ($extension in @('.md', '.markdown')) {
            $programId = (Get-Item -LiteralPath "HKCU:\Software\Classes\$extension").GetValue('')
            if ($programId -cne 'Markwrite.Markdown') { throw "Unexpected ProgID for ${extension}: $programId" }
          }
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class AssociationCommandLine {
            [DllImport("shell32.dll", SetLastError = true, CharSet = CharSet.Unicode)]
            private static extern IntPtr CommandLineToArgvW(string commandLine, out int argc);
            [DllImport("kernel32.dll")] private static extern IntPtr LocalFree(IntPtr memory);
            public static string[] Parse(string commandLine) {
              int argc;
              IntPtr argv = CommandLineToArgvW(commandLine, out argc);
              if (argv == IntPtr.Zero) throw new System.ComponentModel.Win32Exception();
              try {
                var result = new string[argc];
                for (int i = 0; i < argc; i++) result[i] = Marshal.PtrToStringUni(Marshal.ReadIntPtr(argv, i * IntPtr.Size));
                return result;
              } finally { LocalFree(argv); }
            }
          }
          '@
          $document = Join-Path $env:RUNNER_TEMP 'Notes with spaces\中文 document.md'
          $arguments = [AssociationCommandLine]::Parse($command.Replace('%1', $document))
          if ($arguments.Length -ne 2 -or $arguments[0] -cne $env:MARKWRITE_SMOKE_EXE -or $arguments[1] -cne $document) {
            throw 'The registered open command does not preserve a complete document filename'
          }
      - name: Windows independent process and recovery smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/windows-isolation-smoke.ps1 -Executable $env:MARKWRITE_SMOKE_EXE -OutputDirectory (Join-Path $env:RUNNER_TEMP 'markwrite-isolation-results')
      - name: Keep Windows isolation evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-isolation-evidence
          path: ${{ runner.temp }}/markwrite-isolation-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Uninstall Windows test package
        if: always() && runner.os == 'Windows' && env.MARKWRITE_SMOKE_DIR != ''
        shell: pwsh
        run: |
          $uninstaller = Join-Path $env:MARKWRITE_SMOKE_DIR 'uninstall.exe'
          if (-not (Test-Path $uninstaller)) { throw 'Uninstaller is missing' }
          $remove = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "NSIS removal failed: $($remove.ExitCode)" }
      - name: Keep installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 30
